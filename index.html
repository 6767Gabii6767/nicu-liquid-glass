<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101225"><title>Nicu</title>
<style>
:root{color-scheme:dark;--glass:rgba(255,255,255,.105);--line:rgba(255,255,255,.19);--muted:#b9bdd2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#f8f8ff}
body{min-height:100svh;background:radial-gradient(ellipse at 18% 12%,#51458d 0,transparent 42%),radial-gradient(ellipse at 88% 40%,#174c70 0,transparent 38%),linear-gradient(145deg,#111326,#17152f 55%,#091b2b);overflow:hidden}
body:before,body:after{content:"";position:fixed;width:230px;height:230px;border-radius:50%;filter:blur(55px);opacity:.34;pointer-events:none;animation:float 13s ease-in-out infinite alternate}body:before{background:#9b78ff;top:25%;left:-100px}body:after{background:#4bd8df;right:-100px;bottom:5%;animation-delay:-5s}@keyframes float{to{transform:translate(55px,-35px) scale(1.2)}}
.app{position:relative;z-index:1;height:100svh;max-width:780px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%)}
header{margin-top:9px;border-radius:23px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}.orb{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(163,134,255,.35) 48%,rgba(85,224,233,.35));border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 8px #fff7,0 4px 18px #8d7aff55;display:grid;place-items:center;font-size:20px}.brand strong{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.status{font-size:11px;color:#b9f6dd;background:#8af0c31c;border:1px solid #9df5d33b;border-radius:99px;padding:7px 10px}
main{flex:1;overflow:auto;padding:22px 3px 16px;scrollbar-width:none}main::-webkit-scrollbar{display:none}.welcome{text-align:center;margin:8vh auto 28px;max-width:430px}.welcome-icon{width:70px;height:70px;margin:0 auto 17px;border-radius:25px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,#ffffff33,#ffffff08);border:1px solid #ffffff42;box-shadow:inset 0 1px 0 #fff8,0 12px 35px #0003}.welcome h1{font-size:29px;letter-spacing:-.8px;margin:0 0 9px}.welcome p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 auto;max-width:300px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:24px auto 0;max-width:440px}.suggestion{text-align:left;color:#f4f3ff;border-radius:17px;padding:13px;background:rgba(255,255,255,.075);border:1px solid #ffffff20;font-size:12px;line-height:1.35}.suggestion span{display:block;font-size:18px;margin-bottom:7px}
.row{display:flex;margin:12px 0;gap:8px;align-items:flex-end}.row.user{justify-content:flex-end}.bubble{max-width:83%;padding:12px 15px;border-radius:19px;font-size:14px;line-height:1.5;white-space:pre-wrap}.assistant .bubble{border-bottom-left-radius:6px;background:rgba(255,255,255,.105);border:1px solid #ffffff24;backdrop-filter:blur(18px)}.user .bubble{border-bottom-right-radius:6px;background:linear-gradient(135deg,#8271dbb8,#4b91b5a8);border:1px solid #ffffff38}.avatar{width:25px;height:25px;border-radius:9px;display:grid;place-items:center;font-size:12px;background:#ffffff20;border:1px solid #ffffff30;flex:none}
footer{padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.composer{border-radius:25px;padding:8px 9px 8px 16px;display:flex;align-items:flex-end;gap:9px}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;max-height:110px;min-height:27px;padding:5px 0}.composer textarea::placeholder{color:#c5c7d8a8}.send{width:39px;height:39px;flex:none;border:1px solid #ffffff65;border-radius:15px;color:#fff;font-size:18px;background:linear-gradient(145deg,#b9a7ffb8,#5ecbd8a8);box-shadow:inset 0 1px 0 #fff9,0 5px 16px #0003}.send:active{transform:scale(.95)}.note{text-align:center;color:#b8bdd0a8;font-size:10px;margin:8px 4px 0}
@media(min-width:600px){.app{padding-left:22px;padding-right:22px}main{padding-left:12px;padding-right:12px}.welcome{margin-top:9vh}}
</style></head>
<body><div class="app"><header class="glass"><div class="brand"><div class="orb">✧</div><div><strong>Nicu</strong><small>Asistentul tău personal</small></div></div><div class="status">● Demo</div></header>
<main id="chat"><section class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>Cu ce te pot ajuta?</h1><p>Sunt Nicu. Întreabă-mă ceva sau alege una dintre sugestiile de mai jos.</p><div class="suggestions"><button class="suggestion" data-q="Ajută-mă să-mi organizez ziua."><span>◷</span>Organizează-mi ziua</button><button class="suggestion" data-q="Explică-mi un subiect pe înțelesul meu."><span>✧</span>Explică-mi ceva</button><button class="suggestion" data-q="Dă-mi câteva idei creative."><span>◇</span>Idei creative</button><button class="suggestion" data-q="Vreau să învăț ceva nou."><span>⌘</span>Învață-mă ceva nou</button></div></section></main>
<footer><div class="composer glass"><textarea id="input" rows="1" placeholder="Scrie un mesaj..."></textarea><button class="send" id="send" aria-label="Trimite">↑</button></div><div class="note">Versiune demonstrativă · Nu este conectată la OpenAI API</div></footer></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
function add(text,who){document.getElementById('welcome')?.remove();const row=document.createElement('div');row.className='row '+who; if(who==='assistant'){const av=document.createElement('div');av.className='avatar';av.textContent='✧';row.append(av)}const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(b);chat.append(row);chat.scrollTop=chat.scrollHeight}
function reply(q){const s=q.toLowerCase();let answer='Am primit mesajul tău! Aceasta este o versiune demonstrativă a interfeței Nicu. Pentru răspunsuri inteligente reale, va trebui conectat ulterior un serviciu AI, cu respectarea cerințelor de vârstă și a regulilor contului.';if(s.includes('organiz')||s.includes('ziua'))answer='Hai să-ți organizăm ziua. Notează 3 lucruri importante pe care vrei să le faci, începe cu cel mai important și lasă pauze între activități. Ce ai de făcut astăzi?';else if(s.includes('explic'))answer='Sigur! Spune-mi subiectul, iar eu îl voi explica pas cu pas, cu exemple simple. Ce vrei să înțelegi?';else if(s.includes('idei'))answer='Iată trei direcții: creează ceva (desen, poveste sau colaj), învață o abilitate nouă ori încearcă un mini-proiect digital. Pentru ce ai vrea idei?';else if(s.includes('învăț')||s.includes('invat'))answer='Putem învăța despre spațiu, tehnologie, natură, istorie sau programare. Alege un subiect și începem cu o explicație scurtă.';setTimeout(()=>add(answer,'assistant'),450)}
function send(){const q=input.value.trim();if(!q)return;add(q,'user');input.value='';input.style.height='27px';reply(q)}
document.getElementById('send').addEventListener('click',send);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='27px';input.style.height=Math.min(input.scrollHeight,110)+'px'});document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.q;send()}));
</script></body></html>
